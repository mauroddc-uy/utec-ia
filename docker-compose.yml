services:

  backend:
    build:
      context: ./backend
    container_name: utec-ia-backend
    restart: unless-stopped
    expose:
      - "8000"   #exponemos el puerto dentro de docker pero no fuera

  frontend:
    build:
      context: ./frontend
    container_name: utec-ia-frontend
    restart: unless-stopped
    ports:
      - "80:80"   #aca si exponemos el front al puerto 80 externo
    depends_on:
      - backend

  prometheus:
    image: prom/prometheus:latest
    container_name: utec-ia-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - backend

  grafana:
    image: grafana/grafana:latest
    container_name: utec-ia-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  grafana-data:
  prometheus-data:
