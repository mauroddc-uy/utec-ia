services:

  backend:
    build:
      context: ./backend
    container_name: utec-ia-backend
    restart: unless-stopped
    expose:
      - "8000"   #exponemos el puerto dentro de docker pero no fuera

  frontend:
    build:
      context: ./frontend
    container_name: utec-ia-frontend
    restart: unless-stopped
    ports:
      - "80:80"   #aca si exponemos el front al puerto 80 externo
    depends_on:
      - backend