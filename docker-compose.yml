services:

  backend:
    build:
      context: ./backend
    container_name: utec-ia-backend
    restart: unless-stopped
    expose:
      - "8000"   #exponemos el puerto dentro de docker pero no fuera

  frontend:
    build:
      context: ./frontend
    container_name: utec-ia-frontend
    restart: unless-stopped
    ports:
      - "80:80"   #aca si exponemos el front al puerto 80 externo
    depends_on:
      - backend

  prometheus:
    image: prom/prometheus:latest
    container_name: utec-ia-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - backend

  grafana:
    image: grafana/grafana:latest
    container_name: utec-ia-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

  loki:
    image: grafana/loki:3.7.0
    container_name: utec-ia-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yml
    ports:
      - "3100:3100"
    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki

  alloy:
    image: grafana/alloy:latest
    container_name: utec-ia-alloy
    restart: unless-stopped
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    depends_on:
      - loki

volumes:
  grafana-data:
  prometheus-data:
  loki-data:
  alloy-data: