apiVersion: v1
kind: ServiceAccount
metadata:
  name: jenkins-deployer
  namespace: utec-ia-pilot
  labels:
    app.kubernetes.io/part-of: utec-ia
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: jenkins-deployer
  namespace: utec-ia-pilot
rules:
  - apiGroups:
      - ""
    resources:
      - configmaps
      - endpoints
      - events
      - pods
      - pods/log
      - services
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - apps
    resources:
      - deployments
      - deployments/status
      - replicasets
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - networking.k8s.io
    resources:
      - networkpolicies
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jenkins-deployer
  namespace: utec-ia-pilot
subjects:
  - kind: ServiceAccount
    name: jenkins-deployer
    namespace: utec-ia-pilot
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: jenkins-deployer
