apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: utec-ia-pilot
  labels:
    app: backend
    app.kubernetes.io/name: utec-ia-backend
    app.kubernetes.io/part-of: utec-ia
spec:
  replicas: 2
  revisionHistoryLimit: 5
  progressDeadlineSeconds: 120
  minReadySeconds: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
        app.kubernetes.io/name: utec-ia-backend
        app.kubernetes.io/part-of: utec-ia
    spec:
      serviceAccountName: utec-ia-backend
      automountServiceAccountToken: false
      containers:
        - name: backend
          image: utec-ia-backend:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: utec-ia-config
          env:
            - name: UTEC_IA_VERSION
              value: "0.1.0-local"
            - name: UTEC_IA_COMMIT_SHA
              value: "local"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: utec-ia-pilot
  labels:
    app: backend
    app.kubernetes.io/name: utec-ia-backend
    app.kubernetes.io/part-of: utec-ia
spec:
  type: ClusterIP
  selector:
    app: backend
  ports:
    - name: http
      port: 8000
      targetPort: http
