apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: utec-ia-pilot
  labels:
    app: frontend
    app.kubernetes.io/name: utec-ia-frontend
    app.kubernetes.io/part-of: utec-ia
spec:
  replicas: 1
  revisionHistoryLimit: 5
  progressDeadlineSeconds: 120
  minReadySeconds: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
        app.kubernetes.io/name: utec-ia-frontend
        app.kubernetes.io/part-of: utec-ia
    spec:
      serviceAccountName: utec-ia-frontend
      automountServiceAccountToken: false
      containers:
        - name: frontend
          image: utec-ia-frontend:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /frontend-health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /frontend-health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: utec-ia-pilot
  labels:
    app: frontend
    app.kubernetes.io/name: utec-ia-frontend
    app.kubernetes.io/part-of: utec-ia
spec:
  type: ClusterIP
  selector:
    app: frontend
  ports:
    - name: http
      port: 80
      targetPort: http
